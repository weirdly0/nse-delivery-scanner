name: Daily Scanner

on:
  # 11:00 AM IST = 05:30 UTC, Mon-Fri
  # Change to "30 12 * * 1-5" for 6 PM IST (after bhavcopy publishes)
  schedule:
    - cron: "30 5 * * 1-5"
  # Allow manual runs from the Actions tab
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python delivery_scanner.py

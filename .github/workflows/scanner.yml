name: Daily Scanner

on:
  # Azure owns the daily 22:30 IST schedule. Manual-only prevents duplicates.
  workflow_dispatch:
    inputs:
      as_of:
        description: "Market session YYYY-MM-DD (blank = today in IST)"
        required: false
        type: string
      dry_run:
        description: "Preview without sending Telegram"
        type: boolean
        default: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCAN_AS_OF: ${{ inputs.as_of }}
          SCAN_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--universe nse_equity.csv --top-n 500)
          if [[ -n "$SCAN_AS_OF" ]]; then args+=(--as-of "$SCAN_AS_OF"); fi
          if [[ "$SCAN_DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          python delivery_scanner.py "${args[@]}"
